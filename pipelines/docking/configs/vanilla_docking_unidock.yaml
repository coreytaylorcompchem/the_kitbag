task: workflow
workflow_name: vanilla_docking  # corresponds to workflows/vanilla_docking.py

workflow:
  - prepare_receptor_pdbqt
  - standardise_ligand
  - generate_conformers
  - cluster_conformers
  - save_final_conformers
  - convert_to_pdbqt
  - dock

backend:
  name: unidock
  executable_path: "/usr/local/bin/unidock"
  use_gpu: true

protein:
  pdb_path: "/home/corey/Documents/the_kitbag/pipelines/docking/projects/test/vanilla_docking/5yhl.pdb"
  pH: 7.4

# There are two options for docking ligands with this pipeline;

# Option 1: Use a file with a simple list of SMILES (ligs.txt). 

# Use with generate_ligands_from_list true to generate the csv for docking
# This will generate identifiers for you (lig1, lig2, etc.)

# Option 2: Use a csv with your own identifiers (ligands.csv)

# This will simply use what you give it and propagate the identifiers through the docking.
# TODO: Add capability to add other data (e.g. IC50) to the csv that can be used later.

generate_ligands_from_list: true
ligands_txt: "ligs.txt"    
# ligands_csv: "ligands.csv" 

docking:
  output_dir: "output_unidock"
  docking_mode: ensemble # or 'lowest_energy'
  final_n_conformers: 2
  rmsd_threshold: 0.75
  min_energy_gap: 0.5  # in eV
  # Option 1: Explicit center
  # center: [10.5, 22.1, 15.7]
  # size: [15.0, 15.0, 15.0]

  # Option 2: Reference ligand path
  # ref_ligand_path: "/path/to/reference_ligand.sdf"
  # size: [15.0, 15.0, 15.0]

  # Option 3: Use crystallized ligand
  use_crystal_ligand: true
  size: [15.0, 15.0, 15.0]