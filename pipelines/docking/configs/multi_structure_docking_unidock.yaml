task: workflow
workflow_name: multi_structure_docking  
workflow:
  - prepare_receptor_pdbqt
  - standardise_ligand
  - generate_conformers
  - cluster_conformers
  - save_final_conformers
  - convert_to_pdbqt
  - dock

options:
  use_conformer_generation: false

backend:
  name: unidock
  executable_path: "/usr/local/bin/unidock"
  use_gpu: true

protein:
  protein_directory: "/home/corey/Documents/the_kitbag/pipelines/docking/projects/test/multi_structure_docking/pdb"
  pH: 7.4

generate_ligands_from_list: true
ligands_txt: "ligs.txt"    
# ligands_csv: "ligands.csv" 

docking:
  output_dir: "output_multi_structure_unidock"
  docking_mode: ensemble # or 'lowest_energy'
  final_n_conformers: 2
  rmsd_threshold: 0.75
  min_energy_gap: 0.5   # in kcal/mol higher = more permissive
  n_output_binding_modes: 2 # MAX number of output poses and is dependent on min_rmsd and energy_range
  exhaustiveness: 8
  min_rmsd: 0.5 # Specific Uni-dock parameter; higher = more permissive on which poses to keep
  energy_range: 3 # Specific Uni-dock parameter; higher = more permissive (units: kcal/mol). Set 9999 to disable.
  size: [20.0, 20.0, 20.0]
  plot_summarised_docking_results: true # flag to suppress if you're docking tons of ligands.