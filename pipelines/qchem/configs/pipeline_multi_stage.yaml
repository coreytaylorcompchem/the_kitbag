task: workflow
workflow_name: staged_workflow
input_file: inputs/water.xyz

workflow:
  - optimise
  - single_point
  # - mesp

single_point:
  backend: psi4
  method: pbe0
  basis: def2-tzvpp
  ram: 4000        # RAM in MB
  ncpu: 4          # number of CPU cores
  output: 
    log: water_spe.log
    energy: water_energy.txt
    geometry: water_spe.xyz

optimise:
  backend: psi4
  method: bp86
  basis: def2-svp
  ram: 8000        # RAM in MB
  ncpu: 8          # number of CPU cores
  scf_type: pk
  reference: rhf
  maxiter: 50
  output: 
    log: water_opt.log
    energy: water_opt_energy.txt
    geometry: water_opt.xyz
    wfn: water_opt.wfn

