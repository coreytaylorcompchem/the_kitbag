task: workflow
workflow_name: staged_workflow
input_file: inputs/water.xyz

workflow:
  - optimise
  - single_point
  # - mesp

# Most of the scf, grid, etc. parameters are optional. Here for demonstration purposes. 

single_point:
  backend: orca
  method: pbe0
  basis: def2-TZVP
  dispersion: D3BJ          # optional: D3, D3BJ, D4, none
  grid: DEFGRID2            # e.g., DEFGRID1/2/3
  ri: RIJCOSX               # options: RIJCOSX, RI, none
  solvent:
    model: cpcm             # cpcm | smd | cosmo
    epsilon: 80.0           # dielectric constant (optional)
  ram: 4000
  ncpu: 4
  scf:
    scf_type: PK        # direct, semidirect, conventional
    maxiter: 50
    shift: 0.2
    convergence: tight 
    damping: true
    diis: true
  output:
    log: water_spe.log
    energy: water_energy.txt
    geometry: water_spe.xyz

optimise:
  backend: orca
  method: bp86
  basis: def2-SVP
  dispersion: D3BJ
  grid: DEFGRID2            # e.g., DEFGRID1/2/3
  ri: RIJCOSX
  solvent:
    model: cpcm             # cpcm | smd | cosmo
    epsilon: 80.0           # dielectric constant (optional)
  ram: 8000
  ncpu: 8
  scf:
    scf_type: PK        # direct, semidirect, conventional
    maxiter: 50
    shift: 0.2
    convergence: tight 
    damping: true
    diis: true
  reference: RHF        # RHF, UHF, ROHF
  maxiter: 50
  output:
    log: water_opt.log
    energy: water_opt_energy.txt
    geometry: water_opt.xyz
    wfn: water_opt.wfn

