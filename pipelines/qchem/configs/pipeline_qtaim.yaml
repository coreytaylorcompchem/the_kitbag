task: workflow
workflow_name: staged_workflow
input_file: inputs/water.xyz

workflow:
  - optimise
  - qtaim
  - basin
  - nci

optimise:
  backend: psi4
  method: b3lyp
  basis: def2-svp
  solvent: water
  ram: 8000        # RAM in MB
  ncpu: 8          # number of CPU cores
  scf_type: pk
  reference: rhf
  maxiter: 50
  output: 
    log: water_opt.log
    energy: water_opt_energy.txt
    geometry: water_opt.xyz
    wfn: water_opt.molden

# Yes, parameters below repeat. But eventually we'll be able to stack stages with different backends.
# These will need different parameters, including CPUs and others.  

qtaim:
  backend: multiwfn # TopChem or Critic2 or AIMALL
  ncpu: 16 # the more the better with heavy calculations
basin:
  backend: multiwfn 
  ncpu: 16 
nci:
  backend: multiwfn 
  ncpu: 16 

output:
  directory: outputs/qtaim
  overwrite: true