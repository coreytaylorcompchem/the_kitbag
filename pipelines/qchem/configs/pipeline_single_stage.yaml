task: workflow
workflow_name: staged_workflow
input_file: inputs/water.xyz

workflow:
  - single_point

single_point:
  backend: psi4
  method: bp86
  basis: def2-svp
  ram: 4000        # RAM in MB
  ncpu: 4          # number of CPU cores
  output: 
    log: water_spe.log
    energy: water_energy.txt
    geometry: water_spe.xyz

