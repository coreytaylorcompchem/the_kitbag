name: boltz2
channels:
  - conda-forge
  - pytorch
  - nvidia
dependencies:
  - python=3.12
  - pip

  # scientific stack
  - numpy=1.26
  - pandas=2.2
  - scipy=1.13
  - scikit-learn=1.6
  - matplotlib

  # PyTorch
  - pytorch=2.5
  - torchvision=0.20
  - torchaudio=2.5
  - pytorch-cuda=12.1

  # install remaining packages from PyPI
  - pip:
      - boltz==2.2.1
      - biopython==1.84
      - rdkit==2026.3.3
      - wandb==0.18.7
