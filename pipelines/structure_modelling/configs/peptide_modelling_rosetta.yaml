task: workflow
workflow_name: peptide_modelling

workflow:
  - build_peptide
  - minimize_peptide

backend:
  name: pyrosetta         # or colabfold
  rosetta_args: "-mute all"
  score_function: "ref2015"

peptide:
  sequence_file: "data/peptides.txt"

minimization:
  engine: openmm
  method: steepest_descent
  steps: 5000
  platform: CUDA
  forcefield: amber14-all.xml
  implicit_solvent: true

output_dir: "outputs/peptide_modeling"