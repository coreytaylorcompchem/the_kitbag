task: workflow
workflow_name: peptide_modelling

workflow:
  - build_peptide_batch
  - minimize_peptide

backend:
  name: colabfold
  num_models: 5
  use_templates: false
  amber_relax: false

peptide:
  sequence_file: "data/peptides.txt"

minimization:
  engine: openmm
  method: steepest_descent
  steps: 5000
  platform: CUDA
  forcefield: amber14-all.xml
  implicit_solvent: true

output_dir: outputs/peptide_modeling
