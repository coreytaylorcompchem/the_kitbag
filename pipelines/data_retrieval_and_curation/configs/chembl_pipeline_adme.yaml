# Purpose: retrieve and clean data for specific assays and readouts.

task: workflow
workflow_name: chembl_adme_data

assay_keywords:
  Caco-2:
    - caco-2
    - caco2
    - papp
    - apparent permeability
    - permeability
    - a-b permeability
    - b-a permeability
    - intestinal permeability

  MDCK:
    - mdck
    - mdckii
    - apparent permeability
    - permeability
  
  PAMPA: 
    - pampa
    - parallel artificial membrane
    - artificial membrane permeability

  P-gp:
    - p-gp
    - p-glycoprotein
    - pgp
    - mdr1
    - abcb1
    - efflux ratio
    - efflux

  BCRP:
    - bcrp
    - breast cancer resistance protein
    - abcg2

  MRP:
    - mrp
    - multidrug resistance protein
    - abcc

  Solubility:
    - solubility
    - kinetic solubility
    - aqueous solubility

  LogP:
    - logp
    - log p
    - partition coefficient

  LogD:
    - logd
    - distribution coefficient

workflow:
  - retrieve_chembl_assays
  - filter_assays_by_keywords
  - retrieve_assay_activities
  - enrich_activity_metadata
  - harmonise_permeability_units
  - build_multitask_dataset
  - generate_diagnostics

output:
  directory: outputs/adme
  filename: chembl_mtl_dataset.csv