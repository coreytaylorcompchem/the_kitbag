# Purpose: retrieve and standardise PDB data for a single target

task: workflow
workflow_name: pdb_multi_target

uniprot_ids:
  - P34995  # EP1
  - P43116  # EP2
  - Q5CZ57  # EP3
  - P35408  # EP4

remove_waters: true

workflow:
  - retrieve_pdbs
  - standardise_pdbs
  - align_structures

output:
  directory: outputs/multi_target_pdb
  overwrite: true