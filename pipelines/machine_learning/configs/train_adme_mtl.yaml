workflow_name: train_model

workflow:
  - load_smiles_dataset
  - transform_labels
  # - compute_mtl_features
  - featurise_smiles
  - split_data
  - load_adme_model_spec
  - train_adme_model
  - evaluate_adme_model

load_smiles_dataset:
  csv_path: inputs/mtl_sample_chembl.csv
  ### options for sampling, if you need them
  # sampling: 
  #   sample_type: balanced | quantil
  #   n_bins: 20
  #   max_samples_per_bin: 500
    # plot_distributions: true
    # plot_dir: outputs/cyp3a4/sampling

transform_labels:
  label_cols:
    - Solubility
    - LogP
    - LogD
    - Microsomal Stability_Human_mean
    - CYP3A4_IC50_mean
    - hERG_IC50_mean

featurise_smiles:
  featuriser:
    module: models.adme.mtl_adme.featurisation
    function: mol_to_graph
  smiles_col: smiles
  label_cols:
    - Solubility
    - LogP
    - LogD
    - Microsomal Stability_Human_mean
    - CYP3A4_IC50_mean
    - hERG_IC50_mean

split_data:
  val_size: 0.2
  batch_size: 32

load_adme_model_spec:
  module: models.adme.mtl_adme.model
  class: GINRegressor

train_adme_model:
  device: cuda  # or 'cpu' to override
  trainer:
    module: models.adme.mtl_adme.training
    function: train
  batch_size: 32
  max_epochs: 100
  patience: 10
  val_fraction: 0.2
  random_seed: 42
  loss:
    type: weighted_mse
    n_bins: 50
    min_weight: 0.3
    max_weight: 5.0
  loss_curve_dir: outputs/mtl_adme/loss_curves 
  model_path: outputs/mtl_adme/models/mtl_adme_best.pth
  predictions_dir: outputs/mtl_adme/preds

  param_grid:
    # lr: [0.001, 0.0005, 0.0001]
    # hidden_dim: [64, 128, 256]
    lr: [0.001]
    hidden_dim: [64, 128]

evaluate_adme_model:
  evaluator:
      module: models.adme.mtl_adme.evaluation
      function: evaluate
  eval_plot_dir: outputs/mtl_adme/eval
  predictions_dir: outputs/mtl_adme/preds
  save_plots: true
