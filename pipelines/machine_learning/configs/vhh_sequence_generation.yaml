workflow_name: vhh_active_learning

workflow:
  - load_seed_dataset
  - load_esm_model
  - active_learning_rounds

# ---------------------------
# Task configs
# ---------------------------

load_seed_dataset:
  csv_path: data_vhh/2026-01-30_VHHSeqsPhysChemEC50.csv
  expected_len: 125
  multi_condition_props:
    - Tm1 (°C)
    - Pre-peak Sec cats
    - Heparin rel ret time (%)
    - yield (mg/L)
    - HIC rel ret time (%)
  cdr_regions:
    CDR1: [30, 38]
    CDR2: [56, 65]
    CDR3: [95, 115]
  framework_positions:
    - [0, 30]
    - [45, 60]
    - [67, 95]
    - [115, 120]

load_esm_model:
  device: cuda:0
  pretrained_model: esm1b_t33_650M_UR50S
  batch_size: 32

active_learning_rounds:
  n_rounds: 2
  samples_per_seed: 10
  top_candidates_per_round: 100
  n_model_ensemble: 5
  max_mutants: 3
  batch_size: 32
  expected_len: 125   # expected VHH sequence length
  min_per_ancestor: 5
  noise_scale: 1.0
  scoring:
    method: zscore_weighted   # simple | zscore_weighted | pareto_rank
    mutation_penalty: 0.1     # weight for mut_count penalty
    use_novelty_bonus: false
    novelty_weight: 0.05

    # Optimisation direction per property
    optimisation_direction:
      Tm1 (°C): 1
      Pre-peak Sec cats: -1
      Heparin rel ret time (%): -1
      yield (mg/L): 1
      HIC rel ret time (%): -1

    # Optional weights (used for zscore_weighted)
    property_weights:
      Tm1 (°C): 2.0
      Pre-peak Sec cats: 2.0
      Heparin rel ret time (%): 2.0
      yield (mg/L): 1.0
      HIC rel ret time (%): 1.0

  # CatBoost training
  catboost_params:
    loss_function: RMSE
    task_type: GPU
    gpu_ram_part: 0.9
    devices: "0"
    iterations: 400
    depth: 6
    max_ctr_complexity: 1
    learning_rate: 0.05
    subsample: 0.8
    random_strength: 1.0
    l2_leaf_reg: 3.0
    bootstrap_type: Bernoulli
    grow_policy: SymmetricTree
    verbose: False
    allow_writing_files: False
    gpu_cat_features_storage: GpuRam

  early_stopping_rounds: 50
  val_fraction: 0.1

  # PCA
  n_components: 512
  pca_seed: 42

  # UMAP
  umap_n_neighbors: 15
  umap_min_dist: 0.1
  umap_n_epochs: 50

  # Output directories
  data_dir: outputs
  plots_dir: outputs/plots_vhh