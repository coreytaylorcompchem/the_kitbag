workflow_name: dynamic_task_runner

input_file: data/class_a_gpcr_bioactivity_small.csv
chunk_size: 10

workflow:
  - basic_lipinski_filtering
  - physchem_filtering
  - toxic_reactive_filtering

basic_lipinski:
  mw_cutoff: 450
  hbd_cutoff: 5
  hba_cutoff: 10
  rotatable_bonds_cutoff: 10
physchem:
  logp_cutoff: 4.5
  tpsa_cutoff: 140
  qed_cutoff: 0.4
  stereocenters_cutoff: 2

toxic_reactive_file: data/toxic_reactive.csv

output:
  directory: outputs/physchem
  filename: class_a_gpcr_physchem_tox_filtered.csv
  overwrite: true

cleanup: true  # deletes intermediate steps after success
