# Objective: run a standard package of analyses for DNA-encoded library data.
# Output: descriptive analyses useful for exploratory data analysis and 
# dimensionality reduction (PCA/t-SNE, UMAP) useful for ML model building.

workflow_name: streamed_feature_runner

input_file: data/ddr1.parquet
row_groups: 1   # Only read this many row groups (for prototyping)

workflow_preprocess:
  - compute_fingerprints
  - incremental_pca

compute_fingerprints:
  n_bits: 1024
  radius: 2
  smiles_columns: #give names of the smiles columns in your file and the naming after computing fp's.
    smiles_a: fp_a
    smiles_b: fp_b
    smiles_c: fp_c
    smiles: fp_final
  prototyping: # use reduced dataframe for prototyping
    n_rows: 1000        # Only use the first 1000 rows
    random_sample: true # Optionally sample randomly instead of taking first rows

incremental_pca:
  enabled: true
  n_components: 50
  batch_size: 50000
  output:
    directory: outputs/streamed_ddr1       # Where chunks + PCA results go
    filename: reduced_ddr1.parquet         # Combined PCA-reduced dataset

workflow_postprocess:
  - dimensionality_reduction_analyses

dimensionality_reduction_analyses:
  input_file: outputs/streamed_ddr1/reduced_ddr1.parquet
  pca:
    n_components: 2
  tsne:
    n_components: 2
    perplexity: 3
    max_iter: 300
  umap:
    n_components: 2
    metric: jaccard
    n_neighbors: 30
    min_dist: 0.1
    random_state: 42
  clustering:
    enabled: true
    eps: 0.6
    min_samples: 15
    visualize: true
    centroid_images: true
    boxplot: true
    similarity_heatmap: true
  medoid_analysis:
    scaffold: Murcko
    top_n_clusters: 10
  fp_weights: [1.0, 1.0, 1.0, 1.0]          # Weight final product higher
  per_synthon_analysis: true                # Run UMAP per synthon
  plot_properties: [MolWt, LogP, TPSA]      # Color by physicochemical props
  pca_correlation: true                     # Compute PC–enrichment correlation
  synthon_enrichment: true                  # Export per-synthon enrichment
  output_dir: outputs/streamed_ddr1/dimensionality_reduction

cleanup: true  # deletes intermediate steps after success
