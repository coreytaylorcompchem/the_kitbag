# Objective: run a standard package of impactful week-to-week analyses for drug discovery projects.
# Output: scaffold, R-group, MMP and other analyses as summary csvs and plots.

workflow_name: dynamic_task_runner

input_file: data/class_a_gpcr_bioactivity_with_date_test.csv
chunk_size: 100

workflow_parallel:
  - basic_lipinski_filtering
  - physchem_filtering
workflow_serial:
  - physchem_property_drift 
  - druglikeness_indices_trend
  - chemical_space_drift
  - scaffold_enrichment_trends
  - sar_cliff_analysis
  - rgroup_frequency_tracking
  - rgroup_sar_tree
  - mmp_analysis # for now: make sure these are run last; they use output from physchem but overwrite results (need to fix).
  - mmp_report

basic_lipinski:
  mw_cutoff: 450
  hbd_cutoff: 5
  hba_cutoff: 10
  rotatable_bonds_cutoff: 10

physchem:
  logp_cutoff: 4.5
  tpsa_cutoff: 140
  qed_cutoff: 0.4
  stereocenters_cutoff: 2

physchem_property_drift:
  date_col: publication_date
  rolling_window: 4
  output_dir: outputs/mmp/physchem_drift

druglikeness_indices_trend:
  date_col: publication_date
  rolling_window: 4
  output_dir: outputs/mmp/druglikeness_trends

chemical_space_drift:
  fp_type: ecfp4
  fp_radius: 2
  fp_nbits: 1024
  reducer: umap
  color_by: week
  recent_weeks: 12
  activity_col: pActivity
  date_col: publication_date
  output_dir: outputs/mmp/chem_space

scaffold_enrichment_trends:
  activity_col: pActivity
  date_col: publication_date
  top_n_scaffolds: 5
  output_dir: outputs/mmp/scaffold_trends

sar_cliff:
  activity_col: pActivity
  similarity_metric: tanimoto
  fp_type: morgan
  fp_radius: 2
  fp_nbits: 2048
  similarity_cutoff: 0.85
  delta_threshold: 1.0  # property difference threshold to call a “cliff”
  max_pairs: 500000
  output_dir: outputs/mmp/sar_cliffs

rgroup_frequency_tracking:
  activity_col: pActivity
  date_col: publication_date
  output_dir: outputs/mmp/rgroup_frequency
  top_n: 10
  window_weeks: 1

rgroup_sar_tree:
  activity_col: pActivity
  date_col: publication_date
  output_dir: outputs/mmp/rgroup_sar_tree
  core_method: murcko  # or bemis-murcko, scaffold-tree
  min_variants: 10
  
  # R-group combos

  combo_min_count: 3 # controls how many r-group combinations are needed to generate combos df
  combo_heatmap_max_levels: 25
  combo_top_n: 20
  combo_min_count_for_summary: 2
  combo_rank_metric: residual_activity
  combo_score_with_count: true
  combo_plot_top: true

  make_non_hydrogen_combo_plot: true
  non_hydrogen_combo_min_count: 1
  treat_dummy_only_rgroup_as_hydrogen: true

  # plotting controls
  radial_max_nodes: 12
  grid_max_items: 30
  top_n_per_rgroup: 10
  bottom_n_per_rgroup: 10
  page_size: 24
  min_count_for_plot: 1

  # activity display
  activity_sort: descending   # descending for pIC50/pKi/pEC50
  show_std: true
  show_count: true

  # image controls
  mol_img_size: 160
  core_img_size: 260
  dpi: 300

  color_by_activity: true
  show_colorbar: true

mmp_report:
  min_count: 10
  significance_level: 0.05

output:
  directory: outputs/mmp
  filename: class_a_gpcr_physchem_tox_filtered_mmp.csv
  overwrite: true

cleanup: true  # deletes intermediate steps after success
