name: openmm
channels:
  - conda-forge
dependencies:
  # Core Python
  - python=3.11

  # OpenMM stack
  - openmm
  - openmmforcefields
  - pdbfixer
  - mdtraj
  - parmed

  # Amber / chemistry
  - ambertools
  - openbabel
  - rdkit

  # OpenFF stack
  - openff-toolkit
  - openff-forcefields
  - openff-interchange

  # Scientific Python
  - numpy
  - scipy
  - pandas

  # ML
  - pytorch

  - jupyterlab

  # Vis / analysis
  - matplotlib-base
  - seaborn

  # Pip extras
  - pip
  - pip:
      - mdanalysis
      - prolif
      - packmol-memgen
      - mmpbsa-py
      - dimorphite-dl
