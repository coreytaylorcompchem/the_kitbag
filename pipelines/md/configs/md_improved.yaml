task: workflow
workflow_name: molecular_dynamics

workflow:
  # - prepare_system
  # - setup_simulation
  # - minimize
  # - heat_and_equilibrate
  # - production
  - post_processing

prepare_system:
  pdb_file: input/3BGP.pdb
  # ligand_file: input/ligand.sdf  # TODO: Optional
  ligand_parameters: openff-2.0.0.offxml  # Optional
  forcefield: ["amber14-all.xml", "amber14/tip3p.xml"] # Optional
  ionic_strength: 0.15
  box_padding: 1.0
  membrane: false
  lipid_type: POPC
  output_trajectory: "output_hbonds"

setup_simulation: 
  platform: "OpenCL" # CPU, if you're crazy. CUDA if you're sane. OpenCL is slower (~ 20-50%) but usable.
  pH: 7.0
  timestep: 2.0  # fs
  temperature: 300  # K
  # friction: 1.0

heat_and_equilibrate:
  num_heating_steps: 6
  target_temp: 300
  steps_per_round: 100
  restraint_strengths: [10.0, 5.0, 2.0, 1.0, 0.5, 0.0]

production:
  length_ns: 5
  output_trajectory: "output_hbonds/trajectory.dcd"
  output_logfile: "output_hbonds/log.txt"

# These steps can optionally be run after simulations or on any sim that's already done. 
# Just comment out previous steps above.

post_processing:
  solvent_analyses:
    enabled: true
    binding_site_cutoff: 5.0 # distance around the ligand (A) to find hbonds.
    ligand_resname: "UNK"
    water_resname: "HOH"
    start: 0
    stop: -1
    step: 10 # stride length for the traj. For sims > 5 ns, you'd probably bump this to 100. This is for demonstration purposes. 
    top_n: 25  # select top N solvent interactions to include on the plot
    output_dir: "output_hbonds"