task: workflow
workflow_name: rbfe

workflow:
  - openfe_prepare_receptor
  - openfe_sanitise_ligand_sdf # deletes SDF props, as some can cause parsing issues.
  - openfe_create_network
  - openfe_create_alchemical_network
  - openfe_run_network
  - openfe_gather_results

openfe_prepare_receptor:
  equilibrated_pdb: input/protein_equilibrated.pdb
  #### these are optional if you have separate PDBs for protein/water/membrane
  # protein_pdb: input/protein_ions.pdb
  # membrane_pdb: input/membrane.pdb
  # water_pdb: input/waterbox.pdb
  ligand_resname: UNK # tell the system which ligand to remove for FEP, if it's there.
  output_dir: output/openfe # output: receptor_membrane.pdb

openfe_sanitise_ligand_sdf:
  input_sdf: input/FEP_ligands.sdf
  output_sdf: output/openfe/FEP_ligands_sanitised.sdf

openfe_create_network:
  receptor_pdb: output/openfe/receptor_membrane.pdb
  ligand_sdf: output/openfe/FEP_ligands_sanitised.sdf
  network:
    method: lomap # lomap | mst | star 
    radial: false
    mst: false # this can be set to true for lomap
    max_path_length: 6
    # alternatively, use the star representation where transforms are performed from a chosen reference ligand
    # method: star 
    # central_ligand: 0 # specify the central ligand from the sdf (only for star)
  output_dir: output/openfe

openfe_create_alchemical_network:
  receptor_pdb: output/openfe/receptor_membrane.pdb
  output_dir: output/openfe
  protocol:
    platform: CUDA
    repeats: 3
    production_length_ns: 5.0
    equilibration_length_ns: 0.5
    lambda_windows: 11
    checkpoint_interval_ns: 1
    positions_write_frequency_ps: 100

openfe_run_network:
  gpus: [0] # specific which GPUs to run calcs on. If you have 3, this will be [0,1,2] if you want to use all
  jobs_per_gpu: 1 # option to run multiple legs on each GPU, arguable if this actually helps.
  transformations_dir: output/openfe/transformations
  output_dir: output/openfe/results

openfe_gather_results:
  results_dir: output/openfe/results
  output_file: output/openfe/final_results.tsv
  report: dg